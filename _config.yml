# Site settings
title: My Jekyll Blog
description: A blog about interesting things

# Author configuration
defaults:
  -
    scope:
      path: ""      # Apply to all files
      type: "posts" # Apply specifically to posts
    values:
      author:
        name: "Site Default Author"
        bio: "Default author for the blog"
        email: "default@example.com"
        twitter: ""
        linkedin: ""

# Additional site configuration can be added here